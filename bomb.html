<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Probably Boom - Bomb</title>
  <link rel="stylesheet" href="css/theme.css">
  <script src="js/theme.js"></script>
  <link rel="stylesheet" href="css/bomb.css">
</head>
<body class="pre-start">
  <button class="theme-toggle" data-theme-toggle></button>
  <div class="ready" id="menu">
    <strong>Probably Boom</strong>
    <p>Pick a difficulty, then press Start when your expert is ready. The bomb appears and the clock starts right away.</p>
    <div class="diffs">
      <button class="diff" data-d="easy"><b>Easy</b><span></span></button>
      <button class="diff" data-d="normal"><b>Normal</b><span></span></button>
      <button class="diff" data-d="hard"><b>Hard</b><span></span></button>
    </div>
    <p class="warn" id="menuWarn" hidden></p>
    <button id="startBtn" disabled>Start</button>
    <div><a class="home-link" href="index.html">Home</a></div>
    <div class="build" id="build"></div>
  </div>

  <div class="scene" id="scene">
    <div class="cube" id="cube">

      <!-- FRONT: timer, strikes, 2 modules -->
      <div class="face front">
        <header class="top">
          <div class="timer" id="timer">05:00</div>
          <div class="strikes" id="strikes"></div>
        </header>
        <section class="slots" id="slots-front"></section>
      </div>

      <!-- BACK: 4 modules -->
      <div class="face back">
        <section class="slots" id="slots-back"></section>
      </div>

      <!-- SIDES: info the defuser has to read out -->
      <div class="face side right"><div class="batteries" id="batteries"></div></div>
      <div class="face side left"><div class="ports" id="ports"></div></div>
      <div class="face side topf"><div class="label">Serial: <strong id="serial">------</strong></div></div>
      <div class="face side bottomf"><div class="label">Probably Boom</div></div>
    </div>
  </div>

  <div class="controls">
    <p class="message" id="message"></p>
    <button id="frontBtn" class="small">Front</button>
    <button id="backBtn" class="small">Back</button>
    <a class="home-link" href="index.html">Home</a>
  </div>

  <div class="end" id="endScreen" hidden>
    <div class="end-box">
      <h1 id="endTitle"></h1>
      <p id="endReason"></p>
      <button id="againBtn">Try again</button>
      <a class="home-link" href="index.html">Home</a>
    </div>
  </div>

  <script src="js/modules/wires.js"></script>
  <script src="js/modules/button.js"></script>
  <script src="js/modules/timer.js"></script>
  <script src="js/modules/math.js"></script>
  <script src="js/modules/morse.js"></script>
  <script src="js/modules/hex.js"></script>
  <script src="js/modules/resistor.js"></script>
  <script src="js/modules/keypad.js"></script>
  <script src="js/modules/compass.js"></script>
  <script src="js/modules/colors.js"></script>
  <script src="js/modules/lights.js"></script>
  <script src="js/modules/binary.js"></script>
  <script src="js/modules/clock.js"></script>
  <script src="js/modules/sliders.js"></script>
  <script src="js/modules/multibuttons.js"></script>
  <script src="js/modules/logic.js"></script>
  <script src="js/modules/alchemy.js"></script>
  <script src="js/modules/passwords.js"></script>
  <script src="js/modules/simon.js"></script>
  <script src="js/modules/tiles.js"></script>
  <script src="js/modules/fuses.js"></script>
  <script src="js/modules/mazes.js"></script>
  <script src="js/modules/reactor.js"></script>
  <script src="js/version.js"></script>
  <script src="js/bomb.js"></script>
</body>
</html>
